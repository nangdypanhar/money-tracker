<!doctype html>
<!--
  Escape hatch for a device stuck on an old cached version of MoneyTrack: open /reset.html.
  Removes the service worker and cached files, then reloads the app. Your data (IndexedDB) is kept.
  Plain static file on purpose — it must work even when the app itself can't load.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <title>MoneyTrack – Refresh</title>
    <style>
      :root { color-scheme: light dark; --bg: #e9edf4; --fg: #18202f; --muted: #58647a; --primary: #2a62f0; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0e1424; --fg: #eef2f9; --muted: #a1adc4; --primary: #3170ff; } }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
        font-family: Poppins, ui-sans-serif, system-ui, sans-serif; text-align: center; padding: 0 16px; }
      p { color: var(--muted); font-size: 14px; }
      a { display: inline-block; margin-top: 12px; padding: 10px 20px; border-radius: 999px; background: var(--primary);
        color: #fff; text-decoration: none; font-size: 14px; }
    </style>
  </head>
  <body>
    <main>
      <h1 style="font-size: 20px; font-weight: 500">Refreshing MoneyTrack…</h1>
      <p id="status">Clearing cached app files. Your data is kept.</p>
      <a id="open" href="/" hidden>Open MoneyTrack</a>
    </main>
    <script>
      (async () => {
        const status = document.getElementById("status");
        try {
          if ("serviceWorker" in navigator) {
            const regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map((r) => r.unregister()));
          }
          if (typeof caches !== "undefined") {
            const keys = await caches.keys();
            await Promise.all(keys.map((k) => caches.delete(k)));
          }
          status.textContent = "Done. Opening the latest version…";
          setTimeout(() => location.replace("/?refreshed=" + Date.now()), 600);
        } catch (e) {
          status.textContent = "Couldn't clear everything (" + (e && e.message ? e.message : e) + "). Tap below to continue.";
          document.getElementById("open").hidden = false;
        }
      })();
    </script>
  </body>
</html>
